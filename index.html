<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="temp.js" defer></script>
    <link rel="stylesheet" type="text/css" href="rpsStyles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1 id="title">Rock Paper Scissors</h1>

        
        <div class="btnContainer">
            <button id="rock" class="hButton">Rock</button>
            <button id="paper" class="hButton">Paper</button>
            <button id="scissors" class="hButton">Scissors</button>
        </div>
        <div id="game">
            <div id="output">
                <div id="score"></div>
                <div id="selections">
                    <div id="humanSelection"></div>
                    <div id="compSelection"></div>
                </div>
            <div id="result"></div>
            <button id="start">Start</button>
         </div>






</body>
</html>
